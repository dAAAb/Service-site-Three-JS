  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rr = (a, b) => a + (b - a) * rng();
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const col = (c, k = 1) => new THREE.Color(c).multiplyScalar(k);
function M(x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = sx, sz = sx) {
  return new THREE.Matrix4().compose(V3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)), V3(sx, sy, sz));
}

function fillT(g, s, x, y) {

}
function canvasTex(w, h, draw, { srgb = true, repeat = false, text = false } = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (text) textTextures.push({ g, w, h, draw, t });
  return t;
}
function grain(g, w, h, n, light = 'rgba(255,255,255,0.05)', dark = 'rgba(0,0,0,0.06)') {
  for (let i = 0; i < n; i++) {
    g.fillStyle = i & 1 ? light : dark;
    const s = rr(1, 2.6);
    g.fillRect(rng() * w, rng() * h, s, s);
  }
}
function rocFlag(g, x, y, w, h) {
  g.fillStyle = '#d6131f'; g.fillRect(x, y, w, h);
  const cw = w / 2, ch = h / 2, cx = x + cw / 2, cy = y + ch / 2;
  g.fillStyle = '#0e2a8f'; g.fillRect(x, y, cw, ch);
  const R = ch * 0.375, rb = ch * 0.215;
  g.fillStyle = '#ffffff';
  g.beginPath();
  for (let i = 0; i < 24; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 12;
    const r = i % 2 === 0 ? R : rb;
    const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
    i === 0 ? g.moveTo(px, py) : g.lineTo(px, py);
  }
  g.closePath(); g.fill();
  g.fillStyle = '#0e2a8f'; g.beginPath(); g.arc(cx, cy, ch * 0.2, 0, TAU); g.fill();
  g.fillStyle = '#ffffff'; g.beginPath(); g.arc(cx, cy, ch * 0.17, 0, TAU); g.fill();
}
function brushWave(g, w, y0, color, thick, phase, amp = 38) {
  g.strokeStyle = color; g.lineCap = 'round';
  for (let k = 0; k < 16; k++) {
    const off = (k / 15 - 0.5) * thick;
    g.globalAlpha = 0.5 + 0.5 * rng();
    g.lineWidth = rr(2, 7);
    g.beginPath();
    for (let x = -30; x <= w + 30; x += 14) {
      const y = y0 + off + Math.sin(x * 0.0042 + phase) * amp + Math.sin(x * 0.011 + phase * 2) * amp * 0.25 + rr(-1.5, 1.5);
      x === -30 ? g.moveTo(x, y) : g.lineTo(x, y);
    }
    g.stroke();
  }
  g.globalAlpha = 1;
}
function confetti(g, list) {
  for (const [x, y, r, c, s = 1] of list) {
    g.save(); g.translate(x, y); g.rotate(r); g.fillStyle = c;
    g.fillRect(-15 * s, -10 * s, 30 * s, 20 * s); g.restore();
  }
}
function burst(g, x, y, r1, r2, n, colors, lw) {
  g.lineWidth = lw; g.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const a = -Math.PI * 0.95 + (i / (n - 1)) * Math.PI * 0.9;
    g.strokeStyle = colors[i % colors.length];
    g.beginPath();
    g.moveTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1);
    g.lineTo(x + Math.cos(a) * r2, y + Math.sin(a) * r2);
    g.stroke();
  }
}
function pill(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

/* --------------------------------------------------------------- shading */
function ramp(vals) {
  const d = new Uint8Array(vals.length * 4);
  vals.forEach((v, i) => d.set([v, v, v, 255], i * 4));
  const t = new THREE.DataTexture(d, vals.length, 1);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.needsUpdate = true;
  return t;
}
const RAMP = ramp([92, 168, 228, 255]);
const toon = (color, extra = {}) => new THREE.MeshToonMaterial({ color, gradientMap: RAMP, ...extra });
const KIT_MAT = new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: RAMP });
const GLOW_MAT = new THREE.MeshBasicMaterial({ vertexColors: true });

const OUTLINE_MAT = new THREE.ShaderMaterial({
  uniforms: { uColor: { value: new THREE.Color(0x0b0d16) }, uThick: { value: 0.001 } },
  vertexShader: /* glsl */`
    uniform float uThick;
    void main() {
      vec4 p = vec4(position, 1.0);
      vec3 n = normal;
      #ifdef USE_INSTANCING
        p = instanceMatrix * p;
        n = mat3(instanceMatrix) * n;
      #endif
      vec4 mv = modelViewMatrix * p;
      vec3 vn = normalize(normalMatrix * n);
      mv.xyz += vn * uThick * max(-mv.z, 1.0);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */`
    uniform vec3 uColor;
    void main() { gl_FragColor = vec4(uColor, 1.0); }`,
  side: THREE.BackSide,
});
const hullCache = new WeakMap();
function hullOf(geo) {
  let h = hullCache.get(geo);
  if (h) return h;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', geo.attributes.position.clone());
  if (geo.index) g.setIndex(geo.index.clone());
  h = mergeVertices(g, 1e-3);
  h.computeVertexNormals();
  hullCache.set(geo, h);
  return h;
}
function outline(mesh) {
  const h = new THREE.Mesh(hullOf(mesh.geometry), OUTLINE_MAT);
  h.layers.set(1);
  h.raycast = () => {};
  mesh.add(h);
  return mesh;
}

/* ------------------------------------------------------------- geometry */
const geoCache = new Map();
const cached = (k, make) => { let g = geoCache.get(k); if (!g) { g = make(); geoCache.set(k, g); } return g; };
const G = {
  box: new THREE.BoxGeometry(1, 1, 1),
  sph: new THREE.SphereGeometry(0.5, 20, 14),
  sphLo: new THREE.SphereGeometry(0.5, 10, 7),
  ico: new THREE.IcosahedronGeometry(0.5, 2),
  dome: new THREE.SphereGeometry(0.5, 18, 8, 0, TAU, 0, Math.PI / 2),
  hair: new THREE.SphereGeometry(0.5, 18, 10, 0, TAU, 0, Math.PI * 0.57),
  torso: new THREE.CapsuleGeometry(0.19, 0.3, 4, 14),
};
const cylG = (rt, rb, seg = 16) => cached(`c${rt}_${rb}_${seg}`, () => new THREE.CylinderGeometry(rt, rb, 1, seg));
const rboxG = (w, h, d, r) => cached(`r${w}_${h}_${d}_${r}`, () => new RoundedBoxGeometry(w, h, d, 2, Math.min(r, w / 2 - 1e-3, h / 2 - 1e-3, d / 2 - 1e-3)));

class Kit {
  constructor() { this.parts = []; this.stack = [new THREE.Matrix4()]; }
  get top() { return this.stack[this.stack.length - 1]; }
  push(m) { this.stack.push(this.top.clone().multiply(m)); return this; }
  pop() { this.stack.pop(); return this; }
  add(geo, color, m) {
    const g = geo.clone();
    g.applyMatrix4(m ? this.top.clone().multiply(m) : this.top);
    for (const k of Object.keys(g.attributes)) if (k !== 'position' && k !== 'normal') g.deleteAttribute(k);
    const n = g.attributes.position.count;
    const c = color.isColor ? color : new THREE.Color(color);
    const a = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { a[i * 3] = c.r; a[i * 3 + 1] = c.g; a[i * 3 + 2] = c.b; }
    g.setAttribute('color', new THREE.BufferAttribute(a, 3));
    if (!g.index) {
      const idx = new Uint32Array(n);
      for (let i = 0; i < n; i++) idx[i] = i;
      g.setIndex(new THREE.BufferAttribute(idx, 1));
    }
    this.parts.push(g);
    return this;
  }
  box(w, h, d, c, x, y, z, rx = 0, ry = 0, rz = 0) { return this.add(G.box, c, M(x, y, z, rx, ry, rz, w, h, d)); }
  rbox(w, h, d, r, c, x, y, z, rx = 0, ry = 0, rz = 0) { return this.add(rboxG(w, h, d, r), c, M(x, y, z, rx, ry, rz)); }
  cyl(r, h, c, x, y, z, rx = 0, ry = 0, rz = 0, seg = 16, rTop = r) { return this.add(cylG(rTop, r, seg), c, M(x, y, z, rx, ry, rz, 1, h, 1)); }
  sph(sx, sy, sz, c, x, y, z, ax = 0, ay = 0, az = 0, lo = false) { return this.add(lo ? G.sphLo : G.sph, c, M(x, y, z, ax, ay, az, sx * 2, sy * 2, sz * 2)); }
  seg(a, b, r, c, sides = 10, r2 = r) {
    const A = V3(...a), B = V3(...b);
    const d = B.clone().sub(A);
    const len = d.length();
    const q = new THREE.Quaternion().setFromUnitVectors(V3(0, 1, 0), d.normalize());
    return this.add(cylG(r2, r, sides), c, new THREE.Matrix4().compose(A.add(B).multiplyScalar(0.5), q, V3(1, len, 1)));
  }
  build(mat = KIT_MAT, { line = true, layer = 0 } = {}) {
    const mesh = new THREE.Mesh(mergeGeometries(this.parts, false), mat);
    if (layer === 1) mesh.layers.set(1);
    if (line) outline(mesh);
    return mesh;
  }
}

const LIGHT_GLSL = /* glsl */`
  uniform vec3 uLamp;
  uniform float uDoor;
  vec3 envLight(vec3 p) {
    float front = max(p.z + 3.0, 0.0);
    float side = max(abs(p.x) - 7.4, 0.0);
    float spill = exp(-front * 0.33) * exp(-side * side * 0.5) * step(-3.05, p.z) * exp(-max(p.y - 4.4, 0.0) * 0.6);
    float rr = 0.25 + 2.5 * clamp((6.8 - p.y) / 6.8, 0.0, 1.0);
    float lamp = smoothstep(rr, rr * 0.3, length(p.xz - uLamp.xz)) * step(p.y, 6.9);
    return vec3(0.26, 0.34, 0.52) * 0.18
         + vec3(1.0, 0.66, 0.36) * spill * (0.9 + 0.35 * uDoor)
         + vec3(0.72, 0.86, 1.0) * lamp * 1.0;
  }`;

      uTime: U.uTime, uDoor: U.uDoor, uLamp: U.uLamp, uSign: U.uSign, uDown: U.uDown,
    },
    vertexShader: /* glsl */`
      uniform mat4 textureMatrix;
      varying vec4 vRefl;
      varying vec2 vUv;
      varying vec3 vW;
      void main() {
        vUv = uv;
        vRefl = textureMatrix * vec4(position, 1.0);
        vec4 w = modelMatrix * vec4(position, 1.0);
        vW = w.xyz;
        gl_Position = projectionMatrix * viewMatrix * w;
      }`,
    fragmentShader: /* glsl */`
      uniform sampler2D tDiffuse;
      uniform sampler2D tBase;
      uniform sampler2D tMask;
      uniform float uTime;
      uniform float uDoor;
      uniform float uSign;
      uniform float uDown;
      uniform vec3 uLamp;
      varying vec4 vRefl;
      varying vec2 vUv;
      varying vec3 vW;

      float h21(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
      vec3 ripple(vec2 p, float t) {
        vec2 c = floor(p), f = fract(p);
        vec3 acc = vec3(0.0);
        for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
          vec2 o = vec2(float(i), float(j));
          vec2 id = c + o;
          float life = fract(t * (0.7 + 0.5 * h21(id + 17.3)) + h21(id));
          vec2 d = o + vec2(h21(id + 3.1), h21(id + 7.7)) - f;
          float r = length(d);
          float ring = smoothstep(0.08, 0.0, abs(r - life * 0.85)) * (1.0 - life) * (1.0 - life);
          acc.xy += d / max(r, 1e-3) * ring;
          acc.z += ring;
        }
        return acc;
      }
      void main() {
        vec3 base = texture2D(tBase, vUv).rgb;
        float pud = texture2D(tMask, vUv).r;
        float covered = step(-3.05, vW.z) * step(vW.z, -0.95) * step(abs(vW.x), 8.45);

        vec3 amb = vec3(0.055, 0.07, 0.115);
        float front = max(vW.z + 3.05, 0.0);

          pools += exp(-dot(d, d) * 0.9) * (k == 2 ? uDown : 1.0);

        vec2 dl = vW.xz - uLamp.xz;
        vec3 cool = vec3(0.62, 0.8, 1.0) * exp(-dot(dl, dl) * 0.08) * 0.95;
        vec2 ds = vW.xz - vec2(8.6, -1.6);
        vec3 signC = vec3(1.0, 0.45, 0.45) * exp(-dot(ds, ds) * 0.3) * uSign * 0.3;

    g.fillStyle = rg; g.fillRect(0, 0, w, h);
  });
  const halo = (x, y, z, s, c, a = 1) => {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloTex, color: c, transparent: true, opacity: a, blending: THREE.AdditiveBlending, depthWrite: false }));
    sp.position.set(x, y, z); sp.scale.setScalar(s); scene.add(sp); return sp;
  };
  halo(-9.3, 6.8, 7.45, 3.2, '#a9d4ff', 0.9);
  for (const x of [-3.6, 0, 3.6]) halo(x, 9.84, -1.78, 1.3, '#ffe2b8', 0.8);
  for (const x of [-6, -2, 6]) halo(x, 4.22, -1.9, 0.9, '#ffd9a8', 0.55);
  const down3Halo = halo(2, 4.22, -1.9, 0.9, '#ffd9a8', 0.55);
  const vsignHalo = halo(7.75, 7.2, -2.35, 4.6, '#ffd4d4', 0.28);
  halo(-8.3, 2.65, 7.55, 1.3, '#cfe3ff', 0.35);
  for (const x of [-0.72, 0.72]) halo(x, 0.98, 4.12, 0.7, '#ff4a3a', 0.5);
  halo(lampPerson.x - 0.03, 1.32, lampPerson.z + 0.27, 0.45, '#9fd6ff', 0.6);

  const coneMat = new THREE.ShaderMaterial({
    uniforms: { uColor: { value: col('#b9dcff', 0.32) } },
    vertexShader: /* glsl */`
      varying float vY; varying vec3 vN; varying vec3 vV;
      void main() {
        vY = uv.y;
        vN = normalize(normalMatrix * normal);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vV = normalize(-mv.xyz);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: /* glsl */`
      uniform vec3 uColor;
      varying float vY; varying vec3 vN; varying vec3 vV;
      void main() {
        float edge = pow(abs(dot(normalize(vN), normalize(vV))), 1.8);
        float a = edge * pow(vY, 1.3) * (0.35 + 0.65 * smoothstep(0.0, 0.25, vY));
        gl_FragColor = vec4(uColor * a, 1.0);
      }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  });
  const cone = new THREE.Mesh(new THREE.ConeGeometry(2.7, 6.8, 40, 1, true), coneMat);
  cone.position.set(-9.3, 3.4, 7.45);
  cone.layers.set(1);
  scene.add(cone);

  /* ---------- rain */
  const RAIN_N = REDUCED ? 2400 : 5600;
  const rainGeo = new THREE.BufferGeometry();
  const rPos = new Float32Array(RAIN_N * 6);
  const rDrop = new Float32Array(RAIN_N * 8);
  const rEnd = new Float32Array(RAIN_N * 2);
  for (let i = 0; i < RAIN_N; i++) {
    const d = [rr(-12, 12), rr(-12, 12), rng(), rng()];
    rDrop.set(d, i * 8); rDrop.set(d, i * 8 + 4);
    rEnd[i * 2] = 0; rEnd[i * 2 + 1] = 1;
  }
  rainGeo.setAttribute('position', new THREE.BufferAttribute(rPos, 3));
  rainGeo.setAttribute('aDrop', new THREE.BufferAttribute(rDrop, 4));
  rainGeo.setAttribute('aEnd', new THREE.BufferAttribute(rEnd, 1));
  const rainMat = new THREE.ShaderMaterial({
    uniforms: { uTime: U.uTime, uLamp: U.uLamp, uDoor: U.uDoor, uUmb: U.uUmb },
    vertexShader: /* glsl */`
      uniform float uTime;
      uniform vec4 uUmb[4];
      attribute vec4 aDrop;
      attribute float aEnd;
      varying float vA;
      varying vec3 vC;
      ${LIGHT_GLSL}
      const float H = 22.0;
      void main() {
        float speed = 12.0 + aDrop.w * 5.0;
        float fall = mod(aDrop.z * H + uTime * speed, H);
        vec3 head = vec3(aDrop.x + fall * 0.14, H - fall, aDrop.y + fall * 0.04);
        head.x = mod(head.x + 12.0, 24.0) - 12.0;
        head.z = mod(head.z + 12.0, 24.0) - 12.0;
        vec3 dir = normalize(vec3(0.14, -1.0, 0.04));
        float len = 0.32 + aDrop.w * 0.3;
        vec3 p = head - dir * len * aEnd;
        float hide = 0.0;
        if (abs(head.x) < 8.25 && head.z > -11.15 && head.z < -2.85 && head.y < 10.1) hide = 1.0;
        if (abs(head.x) < 8.48 && head.z >= -2.85 && head.z < -0.9 && head.y < 4.85) hide = 1.0;
        if (abs(head.x) < 0.98 && head.z > -0.2 && head.z < 4.1 && head.y < 1.7) hide = 1.0;
        for (int i = 0; i < 4; i++) {
          vec4 u = uUmb[i];
          vec2 d = head.xz - u.xz;
          if (dot(d, d) < u.w * u.w && head.y < u.y) hide = 1.0;
        }
        vC = envLight(head);
        vA = (1.0 - aEnd) * 0.9 * smoothstep(H, H - 7.0, head.y);
        gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);
        if (hide > 0.5) gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
      }`,
    fragmentShader: /* glsl */`
      varying float vA;
      varying vec3 vC;
      void main() { gl_FragColor = vec4(vC, vA); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
  const rain = new THREE.LineSegments(rainGeo, rainMat);
  rain.frustumCulled = false;
  rain.layers.set(1);
  scene.add(rain);

  /* ---------- splashes on open ground */
  const cells = [];
  for (let x = -11.6; x < 12; x += 0.8) for (let z = -11.6; z < 12; z += 0.8) {
    const covered = (Math.abs(x) < 8.5 && z < -0.9) || (Math.abs(x) < 1.0 && z > -0.2 && z < 4.1);
    if (!covered) cells.push(x, z, rng());
  }
  const spGeo = new THREE.BufferGeometry();
  spGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(cells.length), 3));
  spGeo.setAttribute('aSeed', new THREE.BufferAttribute(new Float32Array(cells), 3));
  const splashMat = new THREE.ShaderMaterial({
    uniforms: { uTime: U.uTime, uLamp: U.uLamp, uDoor: U.uDoor, uScale: U.uScale, uSquash: U.uSquash },
    vertexShader: /* glsl */`
      uniform float uTime;
      uniform float uScale;
      attribute vec3 aSeed;
      varying float vLife;
      varying vec3 vC;
      ${LIGHT_GLSL}
      float h11(float n) { return fract(sin(n) * 43758.5453); }
      void main() {
        float t = uTime * (1.1 + aSeed.z * 0.7) + aSeed.z * 7.0;
        float cyc = floor(t);
        vLife = fract(t);
        vec3 p = vec3(aSeed.x + (h11(cyc * 12.9898 + aSeed.x * 78.233 + aSeed.y) - 0.5) * 0.8, 0.03,
                      aSeed.y + (h11(cyc * 4.1414 + aSeed.y * 39.425 + aSeed.x) - 0.5) * 0.8);
        vC = envLight(p) * 0.95;
        vec4 mv = viewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = (0.1 + vLife * 0.42) * uScale / -mv.z;
      }`,
    fragmentShader: /* glsl */`
      uniform float uSquash;
      varying float vLife;
      varying vec3 vC;
      void main() {
        vec2 c = gl_PointCoord * 2.0 - 1.0;
        c.y *= uSquash;
        float r = length(c);
        float ring = smoothstep(0.62, 0.86, r) * smoothstep(1.0, 0.86, r);
        float dot0 = smoothstep(0.45, 0.0, r) * step(vLife, 0.12);
        float a = (ring * (1.0 - vLife) * (1.0 - vLife) + dot0 * 0.6) * 0.55;
        if (a < 0.01) discard;
        gl_FragColor = vec4(vC, a);
      }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
  const splashes = new THREE.Points(spGeo, splashMat);
  splashes.frustumCulled = false;
  splashes.layers.set(1);
  scene.add(splashes);

  /* ---------- eave drips + their ripple rings */
  const drips = [];
  for (let x = -8.2; x <= 8.21; x += 0.82) drips.push([x + rr(-0.12, 0.12), -0.9, rr(1.6, 3.4), rr(0, 4), 4.27, 1]);
  for (const s of [-1, 1]) for (const z of [-2.5, -1.6]) drips.push([s * 8.47, z, rr(1.8, 3.2), rr(0, 4), 4.3, 1]);
  for (const s of [-1, 1]) for (let z = -4.2; z > -11; z -= 1.3) drips.push([s * 8.3, z + rr(-0.3, 0.3), rr(2.2, 4.0), rr(0, 4), 9.7, 1.1]);
  for (let i = 0; i < 4; i++) drips.push([8.33 + rr(-0.03, 0.03), -0.6, 0.32, i * 0.08, 0.28, 0.8]);
  const dA = new Float32Array(drips.length * 4), dB = new Float32Array(drips.length * 2);
  drips.forEach((d, i) => { dA.set([d[0], d[1], d[2], d[3]], i * 4); dB.set([d[4], d[5]], i * 2); });
  const DRIP_GLSL = /* glsl */`
    uniform float uTime;
    attribute vec4 aDripA;
    attribute vec2 aDripB;
    varying vec3 vC;
    varying float vA;
    ${LIGHT_GLSL}
    float tfall(float y0) { return sqrt(2.0 * y0 / 9.8); }
  `;
  const dropGeo = new THREE.InstancedBufferGeometry().copy(new THREE.SphereGeometry(0.035, 8, 6));
  dropGeo.instanceCount = drips.length;
  dropGeo.setAttribute('aDripA', new THREE.InstancedBufferAttribute(dA, 4));
  dropGeo.setAttribute('aDripB', new THREE.InstancedBufferAttribute(dB, 2));
  const dropMat = new THREE.ShaderMaterial({
    uniforms: { uTime: U.uTime, uLamp: U.uLamp, uDoor: U.uDoor },
    vertexShader: DRIP_GLSL + /* glsl */`
      void main() {
        float y0 = aDripB.x, period = aDripA.z;
        float tf = tfall(y0);
        float hang = max(period - tf - 0.05, 0.01);
        float t = mod(uTime + aDripA.w, period);
        vec3 pos = position * aDripB.y;
        float y;
        if (t < hang) { float g = t / hang; pos *= mix(0.25, 1.0, g); y = y0 - 0.03 - 0.02 * g; }
        else { float tt = t - hang; y = y0 - 0.05 - 4.9 * tt * tt; pos.y *= 1.0 + tt * 3.0; }
        vA = y < 0.02 ? 0.0 : 1.0;
        vec3 w = vec3(aDripA.x, max(y, 0.0), aDripA.y) + pos;
        vC = envLight(w) * 1.8 + vec3(0.08, 0.1, 0.14);
        gl_Position = projectionMatrix * viewMatrix * vec4(w, 1.0);
      }`,
    fragmentShader: /* glsl */`
      varying vec3 vC; varying float vA;
      void main() { if (vA < 0.5) discard; gl_FragColor = vec4(vC, 0.9); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
  const dropMesh = new THREE.Mesh(dropGeo, dropMat);
  dropMesh.frustumCulled = false; dropMesh.layers.set(1);
  scene.add(dropMesh);
  const ringBase = new THREE.RingGeometry(0.82, 1.0, 32);
  ringBase.rotateX(-Math.PI / 2);
  const ringGeo = new THREE.InstancedBufferGeometry().copy(ringBase);
  ringGeo.instanceCount = drips.length;
  ringGeo.setAttribute('aDripA', new THREE.InstancedBufferAttribute(dA, 4));
  ringGeo.setAttribute('aDripB', new THREE.InstancedBufferAttribute(dB, 2));
  const ringMat = new THREE.ShaderMaterial({
    uniforms: { uTime: U.uTime, uLamp: U.uLamp, uDoor: U.uDoor },
    vertexShader: DRIP_GLSL + /* glsl */`
      void main() {
        float y0 = aDripB.x, period = aDripA.z;
        float tf = tfall(y0);
        float hang = max(period - tf - 0.05, 0.01);
        float t = mod(uTime + aDripA.w, period);
        float tl = mod(t - hang - tf, period);
        float life = clamp(tl / 0.85, 0.0, 1.0);
        vA = step(tl, 0.85) * (1.0 - life) * (1.0 - life);
        float r = (0.05 + life * 0.42) * aDripB.y;
        vec3 w = vec3(aDripA.x, 0.018, aDripA.y) + position * r;
        vC = envLight(w) * 2.0 + vec3(0.06, 0.08, 0.12);
        gl_Position = projectionMatrix * viewMatrix * vec4(w, 1.0);
      }`,
    fragmentShader: /* glsl */`
      varying vec3 vC; varying float vA;
      void main() { if (vA < 0.01) discard; gl_FragColor = vec4(vC, vA * 0.9); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
  const ringMesh = new THREE.Mesh(ringGeo, ringMat);
  ringMesh.frustumCulled = false; ringMesh.layers.set(1);
  scene.add(ringMesh);
  // downspout water stream
  const streamMat = new THREE.ShaderMaterial({
    uniforms: { uTime: U.uTime },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `uniform float uTime; varying vec2 vUv;
      void main(){ float s = 0.5 + 0.5 * sin(vUv.y * 40.0 + uTime * 30.0); gl_FragColor = vec4(vec3(0.75,0.82,0.95) * (0.25 + 0.35 * s), 0.6); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
  const stream = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.045, 0.3, 8, 1, true), streamMat);
  stream.position.set(8.33, 0.14, -0.62); stream.layers.set(1);
  scene.add(stream);

  /* ---------- post */
  const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: renderer.capabilities.isWebGL2 ? 4 : 0 });
  const composer = new EffectComposer(renderer, rt);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.48, 0.5, 0.98);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());

  /* ---------- camera & controls */
  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.target.set(0, 3.4, 0.4);
  controls.minDistance = 2.5;
  controls.maxDistance = 150;
  controls.minPolarAngle = 0.12;
  controls.maxPolarAngle = 1.5;
  controls.screenSpacePanning = true;
  controls.listenToKeyEvents(window);
  const viewDir = V3(0.26, 0.36, 1).normalize();
  let lastAspect = 0;
  function resize() {
    const w = canvas.clientWidth || window.innerWidth, h = canvas.clientHeight || window.innerHeight;
    const aspect = w / h;
    renderer.setPixelRatio(DPR);
    renderer.setSize(w, h, false);
    composer.setPixelRatio(DPR);
    composer.setSize(w, h);
    camera.aspect = aspect;
    camera.fov = aspect < 0.8 ? 42 : 32;
    camera.updateProjectionMatrix();
    const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    if (!lastAspect) {
      const dist = Math.max(34, 12.4 / (tanH * aspect), 13 / tanH);
      camera.position.copy(controls.target).addScaledVector(viewDir, dist);
    }
    lastAspect = aspect;
    ground.getRenderTarget().setSize(Math.round(w * DPR * 0.5), Math.round(h * DPR * 0.5));
    OUTLINE_MAT.uniforms.uThick.value = 1.35 * 2 * tanH / h;
    U.uScale.value = (h * DPR) / (2 * tanH);
  }
  window.addEventListener('resize', resize);
  resize();

  /* ---------- redraw text once the web font is in */
  const chars = [...usedChars].join('');
  Promise.race([
    Promise.all(['500', '700', '900'].map((wt) => document.fonts.load(`${wt} 40px "Noto Sans TC"`, chars))),
    new Promise((r) => setTimeout(r, 6000)),
  ]).then(() => {
    if (!document.fonts.check(`900 40px "Noto Sans TC"`, '服務')) return;
    for (const t of textTextures) { t.g.clearRect(0, 0, t.w, t.h); t.draw(t.g, t.w, t.h); t.t.needsUpdate = true; }
  }).catch(() => {});

  /* ---------- animate */
  const clock = new THREE.Clock();
  let time = 0, door = 0, doorHold = 0, nextAutoOpen = 9;
  let perfT = 0, perfN = 0, tuned = false;
  const tmpV = V3(0, 0, 0);
  const flick = (t, s, period) => {
    const ph = (t + s * 7.3) % period;
    if (ph < 0.85) { const k = Math.floor(ph * 24); return ((k * 7919 + s * 13) % 5 < 2) ? 0.12 : 1; }
    return 0.96 + 0.04 * Math.sin(t * 53 + s);
  };
  function frame() {
    const raw = Math.min(clock.getDelta(), 0.05);
    const dt = raw * (REDUCED ? 0.45 : 1);
    time += dt;
    U.uTime.value = time;

    // walkers along their loops
    walkers.forEach((w, i) => {
      w.d = (w.d + w.speed * dt) % w.len;
      const u = w.d / w.len;
      const p = w.curve.getPointAt(u), tan = w.curve.getTangentAt(u);
      w.root.position.set(p.x, 0, p.z);
      w.root.rotation.y = Math.atan2(tan.x, tan.z);
      const ph = w.d / w.stride * TAU;
      w.legL.rotation.x = Math.sin(ph) * 0.42;
      w.legR.rotation.x = -Math.sin(ph) * 0.42;
      w.armL.rotation.x = -Math.sin(ph) * 0.3;
      w.inner.position.y = Math.abs(Math.cos(ph)) * 0.022 * w.scale;
      w.umb.rotation.z = Math.sin(ph) * 0.012;
      w.umb.localToWorld(tmpV.set(0, -0.25, 0));
      U.uUmb.value[i].set(tmpV.x, tmpV.y, tmpV.z, 0.68 * w.scale);
    });
    lampUmb.localToWorld(tmpV.set(0, -0.25, 0));
    U.uUmb.value[3].set(tmpV.x, tmpV.y, tmpV.z, 0.68);

    // automatic door: sensor + the occasional phantom open
    const near = walkers.some((w) => Math.abs(w.root.position.x) < 1.9 && w.root.position.z < -0.6 && w.root.position.z > -2.4);
    if (time > nextAutoOpen) { doorHold = time + 3.2; nextAutoOpen = time + 16 + Math.random() * 16; }
    const want = near || time < doorHold ? 1 : 0;
    door += (want - door) * Math.min(1, dt * (want ? 3.2 : 2.0));
    for (const leaf of doorLeaves) leaf.position.x = leaf.userData.s * (0.87 + door * 1.62);
    U.uDoor.value = door;

    // signs breathing / stuttering
    const fv = REDUCED ? 1 : flick(time, 1, 11.5);
    vsignMat.color.setScalar(1.3 * fv);
    vsignHalo.material.opacity = 0.28 * fv;
    U.uSign.value = fv;
    const fd = REDUCED ? 1 : flick(time, 4, 7.7);
    downMat.color.copy(col('#ffe0b0', 3.2 * fd));
    down3Halo.material.opacity = 0.55 * fd;
    U.uDown.value = fd;
    canopyL.intensity = 6.2 + fd * 0.8;
    tvMat.color.setScalar(1.15 + 0.2 * Math.sin(time * 2.3) * Math.sin(time * 0.7));

    // small lives
    updateFlags(time);
    updatePennants(time);
    for (const t of trees) { t.m.rotation.z = Math.sin(time * 0.7 + t.ph) * 0.018; t.m.rotation.x = Math.sin(time * 0.53 + t.ph) * 0.012; }
    catTail.rotation.y = Math.sin(time * 1.4) * 0.35;
    const cw = walkers.find((w) => w.root.position.distanceTo(cat.position) < 4.5);
    const targetYaw = cw ? THREE.MathUtils.clamp(Math.atan2(cw.root.position.x - cat.position.x, cw.root.position.z - cat.position.z) - cat.rotation.y, -0.9, 0.9) : Math.sin(time * 0.25) * 0.2;
    catHeadMesh.rotation.y += (targetYaw - catHeadMesh.rotation.y) * Math.min(1, dt * 2.5);
    dropsTex.offset.y += dt * 0.018;
    const now = new Date();
    const sec = now.getSeconds() + now.getMilliseconds() / 1000, mn = now.getMinutes() + sec / 60, hr = (now.getHours() % 12) + mn / 60;
    clockHands[0].rotation.z = -hr / 12 * TAU; clockHands[1].rotation.z = -mn / 60 * TAU; clockHands[2].rotation.z = -Math.floor(sec) / 60 * TAU;

    // splash ellipse follows camera elevation
    const el = Math.max(0.15, (camera.position.y - controls.target.y * 0.2) / camera.position.distanceTo(controls.target));
    U.uSquash.value = Math.min(4, 1 / Math.max(0.25, el));

    controls.update();
    composer.render();

    if (!tuned) {
      perfT += raw; perfN++;
      if (perfT > 3) {
        tuned = true;
        const fps = perfN / perfT;
        if (fps < 34 && DPR > 1) { DPR = 1; resize(); }
        else if (fps < 24) { DPR = 0.8; resize(); }
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

main().catch((err) => {
  console.error(err);
  document.getElementById('nogl').hidden = false;
});
</script>
